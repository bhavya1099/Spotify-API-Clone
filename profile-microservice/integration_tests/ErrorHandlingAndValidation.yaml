config:
  target: '{{ $processEnvironment.API_HOST }}/v2'
  phases:
    - duration: 60
      arrivalRate: 5
  payload:
    path: "ErrorHandlingAndValidation.csv"
    fields:
      - "petId"
      - "username"
      - "password"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Create a pet without required fields"
    flow:
      - post:
          url: "/pet"
          json: {id: "", name: ""}
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          expect:
            - statusCode: 405
            - equals: 
                contentType: 'application/json'
            - hasProperty: "description"
            - equals: 
                description: 'Invalid input'
          capture:
            - path: "description"
              as: "error"
    log: "Expected error response: {{ error }} when required fields are missing"
  - name: "Find a pet with invalid ID"
    flow:
      - get:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          expect:
            - statusCode: 404
            - equals: 
                contentType: 'application/json'
            - hasProperty: "description"
            - equals: 
                description: 'Pet not found'
          capture:
            - path: "description"
              as: "petNotFoundError"
    log: "Expected error response: {{ petNotFoundError }} when pet ID is invalid"
  - name: "Create a user without required fields"
    flow:
      - post:
          url: "/user"
          json:
            username: "{{ username }}"
            password: ""
          headers:
            Authorization: '{{ $processEnvironment.AUTH_TOKEN }}'
          expect:
            - statusCode: 400
            - equals: 
                contentType: 'application/json'
            - hasProperty: "description"
          capture:
            - path: "description"
              as: "userError"
    log: "Expected error response: {{ userError }} when required fields are missing"
  - name: "Log in with invalid credentials"
    flow:
      - get:
          url: "/user/login"
          qs:
            username: "{{ username }}"
            password: "{{ password }}"
          expect:
            - statusCode: 400
            - equals: 
                contentType: 'application/json'
            - hasProperty: "description"
            - equals: 
                description: 'Invalid username supplied'
          capture:
            - path: "description"
              as: "loginError"
    log: "Expected error response: {{ loginError }} when credentials are invalid"

plugins:
  expect: {} 
