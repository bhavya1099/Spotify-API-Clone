config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 10
  plugins:
    expect: {}
  payload:
    path: "CompletePetStoreManagementFlow.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "password"
      - "phone"
      - "name"
      - "category"
      - "status"
      - "quantity"
      - "shipDate"
      - "status"
    skipHeader: true

scenarios:
  - name: "Petstore User Creation and Login"
    flow:
      - post:
          url: "/v2/user"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            username: "{{ username }}"
            email: "{{ email }}"
            firstName: "{{ firstName }}"
            lastName: "{{ lastName }}"
            password: "{{ password }}"
            phone: "{{ phone }}"
          expect:
            - statusCode: 200
            - hasProperty: username
            - equals: ["{{ username }}", "{{ username }}"]
      - get:
          url: "/v2/user/login?username={{ username }}&password={{ password }}"
          expect:
            - statusCode: 200
            - hasProperty: username
            - hasHeader: x-auth-token

  - name: "Petstore Pet Creation and Retrieval"
    flow:
      - post:
          url: "/v2/pet"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            name: "{{ name }}"
            category: "Cat"
            status: "available"
          expect:
            - statusCode: 200
            - hasProperty: name
            - equals: ["{{ name }}", "{{ name }}"]
      - get:
          url: "/v2/pet/{{ petId }}"
          expect:
            - statusCode: 200
            - hasProperty: name
            - equals: ["{{ name }}", "{{ name }}"]
            
  - name: "Petstore Store Operations"
    flow:
      - get:
          url: "/v2/store/inventory"
          expect:
            - statusCode: 200
            - hasProperty: "available"
            
  - name: "Petstore Order Management"
    flow:  
      - post:
          url: "/v2/store/order"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            quantity: "{{ quantity }}"
            shipDate: "{{ shipDate }}"
            status: "placed"
            petId: "{{ petId }}"
          expect:
            - statusCode: 200
            - hasProperty: quantity
            - equals: [1, "{{ quantity }}"]
      - get:
          url: "/v2/store/order/{{ orderId }}"
          expect:
            - statusCode: 200
            - hasProperty: id
            - equals: ["{{ orderId }}", "{{ orderId }}"]
            
  - name: "Petstore Order Completion"
    flow:
      - put:
          url: "/v2/store/order/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            status: "approved"
          expect:
            - statusCode: 200
            - hasProperty: status
            - equals: "approved"
      - put:
          url: "/v2/store/order/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          json:
            status: "delivered"
          expect:
            - statusCode: 200
            - hasProperty: status
            - equals: "delivered"
