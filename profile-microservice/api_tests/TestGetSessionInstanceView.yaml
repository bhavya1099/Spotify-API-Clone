config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  phases:
    - duration: 1
      arrivalRate: 1
  defaults:
    headers:
      Accept: application/json
      Authorization: Bearer {{ $processEnvironment.AUTH_TOKEN }}
  payload:
    path: "TestGetSessionInstanceView.csv"
    fields: 
      - "id"
      - "username"
      - "firstName"
      - "lastName"
      - "email"
      - "password"
      - "phone"
      - "userStatus"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: testGETSessionInstanceView
    flow:
      - get:
          url: "/user/{{username}}"
          headers:
            api_key: "{{ $processEnvironment.api_key }}"
          expect:
            - statusCode: 200
            - hasProperty: id
            - hasProperty: username
            - hasProperty: firstName
            - hasProperty: lastName
            - hasProperty: email
            - hasProperty: password
            - hasProperty: phone
            - hasProperty: userStatus
      - log: "Retrieving session instance view for user {{username}}"

      - think: 1
