config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  headers:
    Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
  payload:
    path: "ErrorHandlingAndValidation.csv"
    fields: 
      - username
      - password
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Petstore E2E Flow - Error handling and validation"
    flow:
      - post:
          url: "/pet"
          body: "{}"
          headers:
            content-type: "application/json"
          expect:
            - statusCode: 405
            - hasProperty: message
        log: "Pet creation without required fields should return 405 status code, and a message property"
      - get:
          url: "/pet/9999999999999999999"
          expect:
            - statusCode: 404
            - hasProperty: message
        log: "Fetching a pet with invalid ID should return 404 status code, and a message property"
      - get:
          url: "/store/order/0"
          expect:
            - statusCode: 400
            - hasProperty: message
        log: "Fetching an order with ID less than 1 should return 400 status code, and a message property"
      - get:
          url: "/store/order/11"
          expect:
            - statusCode: 400
            - hasProperty: message
        log: "Fetching an order with ID greater than 10 should return 400 status code, and a message property"
      - post:
          url: "/user"
          body: "{}"
          headers:
            content-type: "application/json"
          expect:
            - statusCode: 400
            - hasProperty: message
        log: "User creation without required fields should return 400 status code, and a message property"
      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          expect:
            - statusCode: 400
            - hasProperty: message
        log: "Log in with invalid credentials should return 400 status code, and a message property"
    think: 1
