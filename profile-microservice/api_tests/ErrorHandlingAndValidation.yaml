config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  http:
    baseUrl: "/v2"
  payload:
    path: "ErrorHandlingAndValidation.csv"
    fields:
      - "petId"
      - "orderdId"
      - "username"
      - "password"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Error handling and validation"
    flow:
      - post:
          url: "/pet"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 405
          log: "When I try to create a pet without required fields, I should receive a 405 status code"

      - get:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
          log: "When I try to find a pet with invalid ID, I should receive a 404 status code"

      - get:
          url: "/store/order/{{ orderId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
          log: "When I try to fetch an order with ID less than 1, I should receive a 400 status code"

      - get:
          url: "/store/order/{{ orderId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
          log: "When I try to fetch an order with ID greater than 10, I should receive a 400 status code"

      - post:
          url: "/user"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
          log: "When I try to create a user without required fields, I should receive an error response"

      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          expect:
            - statusCode: 400
          log: "When I try to log in with invalid credentials, I should receive a 400 status code"
