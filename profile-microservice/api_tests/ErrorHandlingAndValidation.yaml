config:
  plugins:
    expect: {}
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 1
      arrivalRate: 1
  payload:
    fields:
      - "id"
      - "username"
      - "firstName"
      - "lastName"
      - "email"
      - "password"
      - "phone"
      - "userStatus"
      - "petId"
      - "quantity"
      - "shipDate"
      - "status"
      - "complete"
    path: "ErrorHandlingAndValidation.csv"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Scenario: Error handling and validation"
    flow:
      - post:
          url: "/pet"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            content-type: "application/json"
          json:
            id: "{{ id }}"
            name: ""
            photoUrls: ["http://example.com/photo.jpg"]
          expect:
            - statusCode: 405
            - hasProperty: "message"
            - propertyEquals: ["message", "Invalid input"]
      - think: 1

      - get:
          url: "/pet/0"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404
            - hasProperty: "message"
            - propertyEquals: ["message", "Pet not found"]
      - think: 1

      - get:
          url: "/store/order/0"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
            - propertyEquals: ["message", "Invalid ID supplied"]
      - think: 1

      - get:
          url: "/store/order/11"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
            - propertyEquals: ["message", "Invalid ID supplied"]
      - think: 1

      - post:
          url: "/user"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
            content-type: "application/json"
          json:
            username: ""
            password: ""
          expect:
            - statusCode: 400
            - hasProperty: "message"
      - think: 1

      - get:
          url: "/user/login?username=&password="
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
            - hasProperty: "message"
            - propertyEquals: ["message", "Invalid username supplied"]
      - think: 1

