config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  phases:
    - duration: 20
      arrivalRate: 1
  payload:
    path: "ErrorHandlingAndValidation.csv"
    fields:
      - "petId"
      - "status"
      - "tags"
      - "additionalMetadata"
      - "name"
      - "orderId"
      - "username"
      - "password"
    skipHeader: true
    delimiter: "^|^"
  environments:
    dev:
      target: "{{ $processEnvironment.API_HOST }}"
scenarios:
  - name: "ErrorHandlingAndValidation"
    flow:
      # Error case scenario when create pet without required fields.
      - post:
          url: "/pet"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 405

      # Error case scenario when find pet with invalid ID.
      - get:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 404

      # Invalid order operations: error case scenario when fetch an order with ID less than 1.
      - get:
          url: "/store/order/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400

      # Invalid order operations: error case scenario when fetch an order with ID greater than 10.
      - get:
          url: "/store/order/{{ orderId }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400

      # Invalid user operations: error case scenario when create a user without required fields.
      - post:
          url: "/user"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400

      # Invalid user operations: error case scenario when log in with invalid credentials.
      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 400
