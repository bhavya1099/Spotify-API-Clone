config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "BulkOperations.csv"
    fields: 
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "name"
      - "category"
      - "status"
    skipHeader: true
    delimiter: "^|^"
  phases:
    - duration: 60
      arrivalRate: 20
  defaults:
    headers:
      Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
scenarios:
  - name: "Scenario: Bulk operations"
    flow:
      - log: "Step: Given I have multiple users to create"
      - post:
          url: "/user/createWithArray"
          json:
            - username: "{{ username }}"
              email: "{{ email }}"
              firstName: "{{ firstName }}"
              lastName: "{{ lastName }}"
          capture:
            json: "$.message"
            as: "responseMessage"
          expect:
            - statusCode: 200
            - equals:
                - "{{ responseMessage }}"
                - "successful operation"
      - think: 1
      - log: "Then all users should be created successfully"
      - think: 1
      - log: "Given I have multiple pets to add"
      - post:
          url: "/pet"
          json:
            name: "{{ name }}"
            category: {name: "{{ category }}"}
            status: "{{ status }}"
          expect:
            - statusCode: 200
      - think: 1
      - log: "Then all pets should be added successfully"
