config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 5
  plugins:
    expect: {}
  payload:
    path: "BulkOperations.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "name"
      - "category"
      - "status"
    skipHeader: true
    delimiter: "^|^"

scenarios:
  - name: "Scenario: Bulk User Creation"
    flow:
      - post:
          url: "/user/createWithArray"
          json:
            - username: "{{ username }}"
              email: "{{ email }}"
              firstName: "{{ firstName }}"
              lastName: "{{ lastName }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: id
            - hasProperty: username
            - hasProperty: firstname
            - hasProperty: lastname
            - hasProperty: email
            - equals: 
                id: '{{ id }}'
                username: '{{ username }}'
                firstname: '{{ firstname }}'
                lastname: '{{ lastname }}'
                email: '{{ email }}'

  - name: "Scenario: Bulk Pet Addition"
    flow:
      - post:
          url: "/pet"
          json:
            name: "{{ name }}"
            category:
              name: "{{ category }}"
            status: "{{ status }}"
          headers:
            Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 405
            - hasProperty: id
            - hasProperty: name
            - hasProperty: category
            - hasProperty: status
            - equals: 
                id: '{{ id }}'
                name: '{{ name }}'
                category: '{{ category }}'
                status: '{{ status }}'
