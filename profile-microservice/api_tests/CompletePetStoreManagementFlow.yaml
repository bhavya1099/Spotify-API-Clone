config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  phases:
    - duration: 60
      arrivalRate: 10
      name: "Simulate Petstore Pet Management, Order, Store, User Use Cases"
  payload:
    path: "CompletePetStoreManagementFlow.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "password"
      - "phone"
      - "name"
      - "category"
      - "status"
      - "quantity"
      - "shipDate"
      - "petId"
    skipHeader: true
    delimiter: "^|^"
scenarios:
  - name: "Petstore Pet Management, Order, Store, User Use Cases"
    flow:
      # User Registration
      - post:
          url: "/user"
          json:
            username: "{{ username }}"
            email: "{{ email }}"
            firstName: "{{ firstName }}"
            lastName: "{{ lastName }}"
            password: "{{ password }}"
            phone: "{{ phone }}"
            userStatus: 1
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasHeader: "Rate-Limit" 
      # User Authentication
      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          expect:
            - statusCode: 200
            - hasHeader: "Authorization"
      # Pet Creation
      - post:
          url: "/pet"
          json:
            name: "{{ name }}"
            status: "{{ status }}"
            category: "{{ category }}"
            photoUrls: ["https://petpic.example.com"]
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
      # Get the Pet details
      - get:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
            - equals:
                - "{{ id }}"
                - "{{ petId }}"
      # Order Creation
      - post:
          url: "/store/order"
          json:
            petId: "{{ petId }}"
            quantity: "{{ quantity }}"
            shipDate: "2022-03-01T10:00:00Z"
            status: "placed"
            complete: false
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
            - equals:
                - "{{ status }}"
                - "placed"
      # Get the Order details
      - get: 
          url: "/store/order/{orderId}"
          expect:
            - statusCode: 200
            - hasProperty: 'id'
      # Delete the Order
      - delete:
          url: "/store/order/{{ orderId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
      # Delete the Pet
      - delete:
          url: "/pet/{{ petId }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
      # Delete the User
      - delete:
          url: "/user/{{ username }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
      # User Logout
      - get:
          url: "/user/logout"
          expect:
            - statusCode: 200
