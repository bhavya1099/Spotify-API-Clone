config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 5
      arrivalRate: 10
  payload:
    path: "CompletePetStoreManagementFlow.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "password"
      - "phone"
      - "name"
      - "category"
      - "status"
      - "quantity"
      - "shipDate"
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}

scenarios:
  - name: "Complete pet store management flow"
    flow:
      - post:
          url: "/v2/user"         
          json:
            username: "{{ username }}"
            firstName: "{{ firstName }}"
            lastName: "{{ lastName }}"
            email: "{{ email }}"
            password: "{{ password }}"
            phone: "{{ phone }}"
            userStatus: 1
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
          log: "The user should be created successfully"
      - think: 1

      - get:
          url: "/v2/user/{{ username }}"
          expect:
            - statusCode: 200
            - hasProperty: "id"
            - hasProperty: "username"
            - hasProperty: "email"
          log: "The user should be successfully logged in"
      - think: 1
 
      - post:
          url: "/v2/pet"
          json:
            name: "{{ name }}"
            status: "{{ status }}"
            category: { "name": "{{ category }}" }
            photoUrls: [""]
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "id"
            - hasProperty: "name"
          log: "The pet should be successfully created"
      - think: 1
 
      - get:
          url: "/v2/store/inventory"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - headerEquals: { "Content-Type": "application/json" }
          log: "The store inventory should be successfully received"
      - think: 1
 
      - post:
          url: "/v2/store/order"
          json:
            petId: "{{ petId }}"
            quantity: "{{ quantity }}"
            shipDate: "{{ shipDate }}"
            status: "placed"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
            - hasProperty: "id"
          log: "The order should be successfully placed"
      - think: 1
      
      - delete:
          url: "/v2/user/{{ username }}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
          log: "The user should be deleted successfully"
      - think: 1
