config:
  target: "{{ $processEnvironment.API_HOST }}"
  phases:
    - duration: 60
      arrivalRate: 5
  payload:
    path: "CompletePetStoreManagementFlow.csv"
    fields:
      - "username"
      - "email"
      - "firstName"
      - "lastName"
      - "password"
      - "phone"
      - "name"
      - "category"
      - "status"
      - "quantity"
      - "shipDate"
      - "orderStatus"
    skipHeader: true
    delimiter: "^|^"
  plugins:
    expect: {}
scenarios:
  - name: Petstore E2E Flow
    flow:
      - post:
          url: "/user"
          json:
            username: "{{ username }}"
            email: "{{ email }}"
            firstName: "{{ firstName }}"
            lastName: "{{ lastName }}"
            password: "{{ password }}"
            phone: "{{ phone }}"
          expect:
            - statusCode: 200
          think: 1
      - get:
          url: "/user/login?username={{ username }}&password={{ password }}"
          expect:
            - statusCode: 200
            - hasHeader: "X-Expires-After"
            - hasHeader: "X-Rate-Limit"
          think: 1
      - post:
          url: "/pet"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            name: "{{ name }}"
            category: "{{ category }}"
            status: "{{ status }}"
          expect:
            - statusCode: 200
          think: 1
      - get:
          url: "/pet/{petId}"
          expect:
            - statusCode: 200
          think: 1
      - post:
          url: "/pet/{petId}/uploadImage"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
            Content-Type: "multipart/form-data"
          formData: 
            file: "image.jpg"
          expect:
            - statusCode: 200
          think: 1
      - put:
          url: "/pet"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            status: "pending"
          expect:
            - statusCode: 200
          think: 1
      - get:
          url: "/pet/findByStatus?status=pending"
          expect:
            - statusCode: 200
            - hasProperty: "id"
            - hasProperty: "category"
            - hasProperty: "name"
            - hasProperty: "photoUrls"
            - hasProperty: "tags"
            - hasProperty: "status"
          think: 1
      - get:
          url: "/store/inventory"
          expect:
            - statusCode: 200
          think: 1
      - post:
          url: "/store/order"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          json:
            petId: "{{ petId }}"
            quantity: "{{ quantity }}"
            shipDate: "{{ shipDate }}"
            status: "{{ orderStatus }}"
          expect:
            - statusCode: 200
          think: 1
      - get:
          url: "/store/order/{orderId}"
          expect:
            - statusCode: 200
          think: 1
      - delete:
          url: "/store/order/{orderId}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
          think: 1
      - delete:
          url: "/pet/{petId}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
          think: 1
      - delete:
          url: "/user/{username}"
          headers:
            Authorization: "{{ $processEnvironment.AUTH_TOKEN }}"
          expect:
            - statusCode: 200
          think: 1
      - get:
          url: "/user/logout"
          expect:
            - statusCode: 200
          think: 1
