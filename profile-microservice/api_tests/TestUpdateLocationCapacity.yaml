scenarios:
  - name: "testUpdateLocationCapacity"
    flow:
      - post:
          url: "/pet"
          json:
            id: 23415
            name: "MytestPet"
          headers: 
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: 200
            - hasProperty: "message"
            - hasProperty: "type"
      - log: "Successfully POSTed new pet and received petId."
      - think: 5
      - get:
          url: "/pet/23415"
          headers: 
            Authorization: "Bearer {{ authToken }}"
          expect:
            - statusCode: 200
            - hasProperty: "id"
            - hasProperty: "name"
            - equals: 
                - "{{ id }}"
                - 23415
            - equals:
                - "{{ name }}"
                - "MytestPet"
      - log: "Successfully GET pet details."
      - think: 5
      - put:
          url: "/pet"
