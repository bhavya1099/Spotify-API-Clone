config:
  target: "{{ $processEnvironment.API_HOST }}"
  plugins:
    expect: {}
  payload:
    path: "./TestFetchNonExistentSession.csv"
    fields:
      - petId
    skipHeader: true
    delimiter: "^|^"
  headers:
    Authorization: "Bearer {{ $processEnvironment.AUTH_TOKEN }}"
scenarios:
  - name: testFetchNonExistentSession  
    flow:
      - log: "Feature: All API Test"
      - log: "Scenario: testFetchNonExistentSession"
      - post:
          url: "/pet"
          json:
            id: {{ petId }}
            name: "Doggie"
            photoUrls: ["demoUrl"]
            status: "available"
          capture:
            - json: "$.header.Location"
              as: "petLocation"
      - think: 1
      - log: "When the scenario executes"
      - get: "/pet/{{ petId }}"
        expect:
          - statusCode: 404
          - hasProperty: "message"
          - equals: 
              - "{{ message }}" 
              - "Session with ID R64EKX5RG32U not found"
      - log: 'Then the outcome should be "404 Not Found" And the details are: "Session with ID R64EKX5RG32U not found"'
 